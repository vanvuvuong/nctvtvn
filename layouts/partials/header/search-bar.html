{{- if .Site.Params.searchBar }}
  {{- $expandBreakpoint := default "xxl" site.Params.topAppBar.expandBreakpoint }}
  <hr class="d-{{ $expandBreakpoint }}-none">
  <div class="search-bar ms-auto my-auto">
    <link href="/pagefind/pagefind-ui.css" rel="stylesheet">
    <style>
      :root {
        --pagefind-ui-scale: 0.8;
        --pagefind-ui-primary: #034ad8;
        --pagefind-ui-text: #393939;
        --pagefind-ui-background: #ffffff;
        --pagefind-ui-border: #eeeeee;
        --pagefind-ui-tag: #eeeeee;
      }
      [data-bs-theme='dark'] {
        --pagefind-ui-primary: #6ea8ff;
        --pagefind-ui-text: #e0e0e0;
        --pagefind-ui-background: #1e1e2e;
        --pagefind-ui-border: #3a3a4a;
        --pagefind-ui-tag: #2a2a3a;
      }
      .pagefind-ui {
        background-color: var(--pagefind-ui-background) !important;
        border-radius: 8px;
        padding: 0 12px;
      }
      .pagefind-ui mark {
        color: #000;
        background-color: #facc15;
      }
      [data-bs-theme='dark'] .pagefind-ui mark {
        color: #1e1e2e;
      }
      .pagefind-ui a,
      .pagefind-ui__result-link {
        color: var(--pagefind-ui-text) !important;
        text-decoration: none !important;
      }
      .pagefind-ui a:hover,
      .pagefind-ui__result-link:hover {
        text-decoration: underline !important;
      }
      .pagefind-ui__message,
      .pagefind-ui__result-title,
      .pagefind-ui__result-excerpt,
      .pagefind-ui__result-nested .pagefind-ui__result-link {
        color: var(--pagefind-ui-text) !important;
      }
      .pagefind-ui__search-input {
        color: var(--pagefind-ui-text) !important;
        background-color: var(--pagefind-ui-background) !important;
      }
      .pagefind-ui__search-clear {
        color: var(--pagefind-ui-text) !important;
        background-color: var(--pagefind-ui-background) !important;
      }
    </style>
    <script src="/pagefind/pagefind-ui.js"></script>
    <div id="search"></div>
    <script>
      window.addEventListener('DOMContentLoaded', (event) => {
        new PagefindUI({
          element: "#search",
          showSubResults: true,
          showImages: false,
          translations: {
            placeholder: "Tìm kiếm (ấn /)",
            clear_search: "Xóa",
            zero_results: "Không tìm thấy kết quả cho [SEARCH_TERM]",
            many_results: "[COUNT] kết quả cho [SEARCH_TERM]",
            one_result: "[COUNT] kết quả cho [SEARCH_TERM]",
            searching: "Đang tìm [SEARCH_TERM]...",
            load_more: "Xem thêm"
          }
        });
      });
      document.addEventListener('keydown', (e) => {
        const input = document.querySelector('.pagefind-ui__search-input');
        if (e.key === '/' && !['INPUT','TEXTAREA'].includes(document.activeElement.tagName) && !document.activeElement.isContentEditable) {
          e.preventDefault();
          input.focus();
        }
        if (e.key === 'Escape' && document.activeElement === input) {
          const clearBtn = document.querySelector('.pagefind-ui__search-clear');
          if (clearBtn) clearBtn.click();
          input.blur();
        }
      });
      document.addEventListener('click', (e) => {
        const input = document.querySelector('.pagefind-ui__search-input');
        if (!input || !input.value) return;
        const searchContainer = document.querySelector('#search');
        if (!searchContainer.contains(e.target)) {
          const clearBtn = document.querySelector('.pagefind-ui__search-clear');
          if (clearBtn) clearBtn.click();
          input.blur();
        }
      });
    </script>
  </div>
{{- end -}}
